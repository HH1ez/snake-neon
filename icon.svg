<svg xmlns="http://www.w3.org/2000/svg" width="512" height="512" viewBox="0 0 512 512">
  <defs>
    <radialGradient id="bg" cx="50%" cy="50%">
      <stop offset="0%" stop-color="#1a0b3d"/>
      <stop offset="100%" stop-color="#05010f"/>
    </radialGradient>
    <filter id="glow" x="-50%" y="-50%" width="200%" height="200%">
      <feGaussianBlur stdDeviation="8" result="blur"/>
      <feMerge>
        <feMergeNode in="blur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
  </defs>

  <rect width="512" height="512" fill="url(#bg)" rx="60"/>

  <g filter="url(#glow)">
    <rect x="130" y="230" width="56" height="56" rx="8" fill="#00e5ff"/>
    <circle cx="148" cy="248" r="6" fill="#fff"/>
    <circle cx="168" cy="248" r="6" fill="#fff"/>
    <circle cx="150" cy="250" r="3" fill="#000"/>
    <circle cx="170" cy="250" r="3" fill="#000"/>

    <rect x="186" y="230" width="56" height="56" rx="8" fill="#00c8e5"/>
    <rect x="242" y="230" width="56" height="56" rx="8" fill="#00a8c8"/>
    <rect x="242" y="174" width="56" height="56" rx="8" fill="#0090b0"/>
    <rect x="298" y="174" width="56" height="56" rx="8" fill="#0078a0"/>
  </g>

  <g filter="url(#glow)">
    <circle cx="390" cy="290" r="34" fill="#ff2d95"/>
    <circle cx="382" cy="282" r="10" fill="#fff" opacity="0.5"/>
  </g>
</svg>